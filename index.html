<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>أطلس الوادي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --paper:#f5efe3;--paper2:#ece3d2;--ink:#23201b;--soft:#6f6557;--line:#ddd1bb;
  --clay:#b4532a;--clay-d:#8f3f1e;--olive:#566638;--gold:#c9a35a;--night:#1b1916;
  --ok:#3f7d4e;--bad:#b23b3b;--r:16px;
  --display:'Amiri',serif;--ui:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:var(--ui);background:var(--night);color:var(--ink);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}
#map{position:absolute;inset:0}

/* ---------- الغلاف ---------- */
.cover{position:fixed;inset:0;z-index:50;background:var(--night) center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;transition:opacity .7s,visibility .7s}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,25,22,.15) 0%,rgba(27,25,22,.35) 40%,rgba(27,25,22,.94) 82%)}
.cover.hide{opacity:0;visibility:hidden}
.cover-in{position:relative;padding:28px 24px 34px;max-width:640px;width:100%;margin:0 auto}
.kicker{font-size:13px;letter-spacing:.04em;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:8px}
.kicker::before{content:"";width:28px;height:1px;background:var(--gold)}
.cover h1{font-family:var(--display);font-size:clamp(40px,11vw,68px);line-height:1.15;margin:10px 0 6px;font-weight:700}
.cover p.sub{margin:0 0 6px;font-size:16px;color:#e6dccb}
.cover p.about{margin:10px 0 0;font-size:15px;line-height:1.9;color:#d5cab7;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:flex;gap:26px;margin:20px 0 22px}
.stats div b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:#fff}
.stats div span{font-size:12px;color:#bdb19c}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;transition:transform .12s,background .2s}
.b:active{transform:scale(.97)}
.b.pri{background:var(--clay);color:#fff}.b.pri:hover{background:var(--clay-d)}
.b.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
.b.lite{background:var(--paper2);color:var(--ink)}
.b.out{border:1px solid var(--line);color:var(--ink);background:#fff}
.b.danger{background:var(--bad);color:#fff}
.b.sm{padding:8px 14px;font-size:13.5px}
.b[disabled]{opacity:.45;pointer-events:none}

/* ---------- الترويسة ---------- */
.head{position:absolute;top:12px;right:12px;left:12px;z-index:6;display:flex;align-items:flex-start;gap:10px;pointer-events:none}
.brand{pointer-events:auto;background:rgba(27,25,22,.86);color:#fff;border-radius:14px;padding:9px 16px 10px;backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:70vw;border:1px solid rgba(201,163,90,.35)}
.brand b{font-family:var(--display);font-size:21px;line-height:1.2;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11.5px;color:#c9bda7;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls{pointer-events:auto;margin-inline-start:auto;display:flex;flex-direction:column;gap:8px}
.cbtn{width:42px;height:42px;border-radius:12px;background:rgba(245,239,227,.96);box-shadow:0 4px 14px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--ink)}
.cbtn.on{background:var(--clay);color:#fff}
.chips{position:absolute;top:76px;right:12px;left:66px;z-index:5;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;background:rgba(245,239,227,.95);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.22)}
.chip.on{background:var(--ink);color:#fff}

/* ---------- العلامات ---------- */
.mk{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk .dot{width:36px;height:36px;border-radius:50%;background:var(--clay);color:#fff;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.45);font-size:15px;transition:transform .2s}
.mk .stem{width:2px;height:10px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.5)}
.mk .lbl{order:-1;margin-bottom:5px;background:rgba(27,25,22,.88);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:7px;white-space:nowrap;font-family:var(--ui)}
.mk.old .dot{background:#6b4a2b}
.mk.active .dot{transform:scale(1.22);background:var(--gold);color:var(--night)}
body.quiz .mk .lbl{display:none}
body.quiz .mk:not(.target){opacity:.25;pointer-events:none}
body.quiz .mk.target .dot{background:var(--gold);color:var(--night);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,163,90,.8)}100%{box-shadow:0 0 0 22px rgba(201,163,90,0)}}

/* ---------- شريط التنقل ---------- */
.nav{position:absolute;z-index:9;bottom:12px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 24px));background:rgba(27,25,22,.94);border-radius:18px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.4);backdrop-filter:blur(10px)}
.nav button{color:#b9ad98;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:13px;font-size:11.5px;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button.on{background:var(--paper);color:var(--ink)}

/* ---------- اللوحة ---------- */
.sheet{position:absolute;z-index:8;background:var(--paper);display:none;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet.open{display:flex}
@media (min-width:860px){.sheet{top:84px;bottom:88px;right:14px;width:410px;border-radius:20px}.grab{display:none}}
@media (max-width:859px){.sheet{left:0;right:0;bottom:0;height:66vh;border-radius:22px 22px 0 0;padding-bottom:78px;transition:height .3s}.sheet.peek{height:210px}.sheet.tall{height:84vh}}
.grab{padding:9px 0 3px;display:flex;justify-content:center;cursor:pointer}.grab i{width:42px;height:4px;border-radius:4px;background:var(--line)}
.sh-h{display:flex;align-items:center;gap:10px;padding:6px 18px 10px}
.sh-h h2{font-family:var(--display);font-size:26px;margin:0;flex:1;line-height:1.3}
.xb{width:34px;height:34px;border-radius:50%;background:var(--paper2);display:flex;align-items:center;justify-content:center}
.sh-b{overflow-y:auto;padding:0 18px 22px;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--paper2);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--soft)}
.tag.c{background:var(--clay);color:#fff}
.story{white-space:pre-wrap;line-height:2;font-size:15.5px;margin:0 0 6px}
.hero{width:100%;height:190px;object-fit:cover;border-radius:14px;display:block;margin-bottom:14px;cursor:pointer;background:#000}
h3.sec{font-family:var(--display);font-size:20px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--soft);font-size:13.5px;line-height:1.8}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gal figure{margin:0;position:relative;border-radius:12px;overflow:hidden;background:#000;cursor:pointer}
.gal img,.gal video{width:100%;height:120px;object-fit:cover;display:block}
.gal figcaption{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:11px;padding:16px 8px 5px}
.bdg{position:absolute;top:6px;right:6px;background:rgba(27,25,22,.8);color:#fff;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px}
.bdg.o{background:#6b4a2b}
.pager{display:flex;align-items:center;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.pager span{flex:1;text-align:center;font-size:13px;color:var(--soft)}
/* مقارنة الأمس واليوم */
.cmp{position:relative;border-radius:14px;overflow:hidden;height:210px;background:#000;direction:ltr;user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .ln{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.6);pointer-events:none}
.cmp .ln::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:var(--ink);border-radius:999px;padding:2px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmp .tl{position:absolute;bottom:8px;background:rgba(27,25,22,.78);color:#fff;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;pointer-events:none;direction:rtl}
/* القوائم */
.pl{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:start}
.pl .n{width:40px;height:40px;border-radius:12px;background:var(--paper2);color:var(--clay);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.pl .th{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none}
.pl b{display:block;font-size:15.5px}.pl small{color:var(--soft);font-size:12.5px}
.empty{text-align:center;padding:28px 10px;color:var(--soft)}
.empty svg{width:44px;height:44px;color:var(--line);margin-bottom:8px}
/* الدروس */
.lesson{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.lesson .no{font-family:var(--display);color:var(--clay);font-size:14px;font-weight:700}
.lesson h4{font-family:var(--display);font-size:21px;margin:2px 0 6px}
.lesson p{margin:0 0 10px;line-height:1.95;font-size:14.5px}
.ask{background:var(--paper);border-inline-start:3px solid var(--gold);border-radius:8px;padding:9px 12px;font-size:13.5px;line-height:1.8;margin-bottom:12px}
.ask b{color:var(--clay-d)}
.tline{position:relative;padding-inline-start:20px;border-inline-start:2px solid var(--line);margin-inline-start:6px}
.tline button{display:block;text-align:start;width:100%;padding:0 0 16px;position:relative}
.tline button::before{content:"";position:absolute;inset-inline-start:-27px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--clay);border:2px solid var(--paper)}
.tline small{color:var(--clay-d);font-weight:700;font-size:12.5px}.tline b{display:block;font-size:15px}
/* الاختبار */
.prog{height:6px;background:var(--paper2);border-radius:6px;overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--clay);transition:width .3s}
.q{font-family:var(--display);font-size:23px;margin:0 0 12px;line-height:1.5}
.qimg{width:100%;height:180px;object-fit:cover;border-radius:14px;margin-bottom:12px;background:#000}
.opt{display:block;width:100%;text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:13px 16px;font-size:15.5px;font-weight:600;margin-bottom:8px}
.opt.ok{background:#e4f1e6;border-color:var(--ok);color:var(--ok)}.opt.no{background:#f6e3e1;border-color:var(--bad);color:var(--bad)}
.score{text-align:center;padding:14px 0}.score b{font-family:var(--display);font-size:64px;color:var(--clay);display:block;line-height:1}
/* النماذج */
label.f{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:14px 0 5px}
input[type=text],textarea,select{width:100%;font-family:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical;line-height:1.8}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick .it{position:relative;border-radius:10px;overflow:hidden;border:3px solid transparent;cursor:pointer;background:#000}
.pick .it.sel{border-color:var(--clay)}
.pick img,.pick video{width:100%;height:78px;object-fit:cover;display:block}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
/* شريط التحرير */
.ebar{position:absolute;z-index:7;bottom:86px;left:50%;transform:translateX(-50%);display:none;gap:6px;background:var(--gold);padding:6px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
body.edit .ebar{display:flex}
body.edit.sheet-open .ebar{display:none}
.ebar button{background:var(--night);color:#fff;border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center;white-space:nowrap}
.edit-only{display:none!important}body.edit .edit-only{display:inline-flex!important}
.hint{position:absolute;top:76px;left:50%;transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:10;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap;border:1px solid var(--gold)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column}
.lb.open{display:flex}.lb img,.lb video{max-width:94vw;max-height:78vh;border-radius:10px}
.lb .cap{color:#fff;margin-top:12px;font-size:15px;text-align:center;padding:0 18px}
.lb .xb{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.15);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}.modal .box{background:var(--paper);border-radius:20px;max-width:460px;width:100%;padding:22px;max-height:88vh;overflow:auto}
.modal h3{font-family:var(--display);font-size:24px;margin:0 0 6px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 18px;border-radius:999px;z-index:70;display:none;font-weight:600;font-size:14px;border:1px solid var(--gold)}
.maplibregl-ctrl-attrib{font-size:10px}.maplibregl-ctrl-bottom-right{bottom:76px}.maplibregl-ctrl-bottom-left{bottom:76px}
.maplibregl-popup-content{font-family:var(--ui);border-radius:12px;padding:10px 14px;text-align:center;direction:rtl}
.maplibregl-popup-content b{font-family:var(--display);font-size:24px;color:var(--clay);display:block}
</style>
</head>
<body>
<div id="map" dir="ltr"></div>

<section class="cover" id="cover">
  <div class="cover-in">
    <div class="kicker">أطلس تراثي ثلاثي الأبعاد</div>
    <h1 id="cvTitle">أطلس الوادي</h1>
    <p class="sub" id="cvSub"></p>
    <p class="about" id="cvAbout"></p>
    <div class="stats" id="cvStats"></div>
    <div class="cta">
      <button class="b pri" id="cvTour"></button>
      <button class="b ghost" id="cvMap"></button>
    </div>
  </div>
</section>

<header class="head">
  <div class="brand" id="brand"><b id="hTitle">أطلس الوادي</b><span id="hSub"></span></div>
  <div class="ctrls">
    <button class="cbtn on" id="c3d" title="ثلاثي / علوي">3D</button>
    <button class="cbtn" id="cN" title="الشمال"></button>
    <button class="cbtn" id="cAlt" title="قياس الارتفاع"></button>
  </div>
</header>
<div class="chips" id="chips"></div>
<div class="hint" id="hint"></div>

<div class="ebar" id="ebar"></div>

<aside class="sheet" id="sheet">
  <div class="grab" id="grab"><i></i></div>
  <div class="sh-h"><h2 id="shT"></h2><button class="xb" id="shX"></button></div>
  <div class="sh-b" id="shB"></div>
</aside>

<nav class="nav" id="nav"></nav>

<div class="lb" id="lb"><button class="xb" id="lbX"></button><div id="lbM"></div><div class="cap" id="lbC"></div></div>
<div class="modal" id="modal"><div class="box" id="mBox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fImp" accept=".json,application/json" hidden>

<script>
/* ================= أيقونات ================= */
const P={
 village:'M3 20V11l5-4 5 4v9M13 20v-6l4-3 4 3v6M2 20h20M7 20v-4h2v4',
 house:'M7 21V6l1-2h8l1 2v15M4 21h16M10 21v-4h4v4M10 9h1M13 9h1M10 13h1M13 13h1',
 mountain:'M2 20l7-12 4 6 2-3 7 9zM7.5 10.5l1.5 1.5 1.5-1',
 terrace:'M3 8c4-2 8 2 18 0M3 13c4-2 8 2 18 0M3 18c4-2 8 2 18 0',
 water:'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z',
 road:'M9 21L11 3M15 21L13 3M12 7v2M12 12v2M12 17v2',
 mosque:'M4 21v-9M20 21v-9M4 12h16M6 12a6 6 0 0 1 12 0M12 6V3M2 21h20M10 21v-4a2 2 0 0 1 4 0v4',
 school:'M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z',
 tree:'M12 21v-7M12 14a5 5 0 0 1-5-5 5 5 0 0 1 10 0 5 5 0 0 1-5 5zM9 21h6',
 event:'M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2zM10 8h6M10 12h6M10 16h3',
 grave:'M7 21V9a5 5 0 0 1 10 0v12M4 21h16M12 9v5M10 11h4',
 other:'M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',
 map:'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14',
 list:'M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01',
 quiz:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01',
 x:'M6 6l12 12M18 6L6 18', plus:'M12 5v14M5 12h14', play:'M7 4l13 8-13 8z',
 next:'M15 6l-6 6 6 6', prev:'M9 6l6 6-6 6',
 north:'M12 3l5 18-5-4-5 4z', ruler:'M3 17L17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2',
 edit:'M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4', pin:'M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z',
 down:'M12 4v12M6 11l6 6 6-6M4 21h16', up:'M12 20V8M6 13l6-6 6 6M4 3h16', eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
 move:'M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3',
 clock:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2', trash:'M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]||P.other}"/></svg>`;
const TYPES={village:'قرية / حارة',house:'بيت / حصن',mountain:'جبل / قمة',terrace:'مدرجات زراعية',water:'بئر / غيل / سيل',road:'طريق / عقبة',mosque:'مسجد',school:'مدرسة / معلامة',tree:'شجرة / شِعب',event:'واقعة / حدث',grave:'مقبرة / ضريح',other:'معلم آخر'};

/* ================= البيانات ================= */
const BUILTIN={
 p1:{kind:'image',data:'media/p1.jpg',caption:'المدرجات والبيوت تحت الغيم'},
 p2:{kind:'image',data:'media/p2.jpg',caption:'القرية بين الجبال'},

/* قراءة الارتفاع مباشرة من بلاطة الارتفاعات */
function altAt(ll){return new Promise(res=>{
  const z=13,n=2**z,x=(ll.lng+180)/360*n,lr=ll.lat*Math.PI/180,y=(1-Math.log(Math.tan(lr)+1/Math.cos(lr))/Math.PI)/2*n;
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.drawImage(img,0,0);
    const d=g.getImageData(Math.min(255,Math.floor((x%1)*256)),Math.min(255,Math.floor((y%1)*256)),1,1).data;res(Math.round(d[0]*256+d[1]+d[2]/256-32768));}catch(e){res(null);}};
  img.onerror=()=>res(null);
  img.src=DEM.replace('{z}',z).replace('{x}',Math.floor(x)).replace('{y}',Math.floor(y));
  setTimeout(()=>res(null),6000);
});}

    el.className='mk'+(pMedia(p).some(m=>m.old)?' old':'')+(p.id===activeId?' active':'');el.dataset.id=p.id;
    el.innerHTML=`<div class="lbl">${esc(p.name)}</div><div class="dot">${ic(p.type)}</div><div class="stem"></div>`;
    el.addEventListener('click',e=>{e.stopPropagation();if(!document.body.classList.contains('quiz'))showPoint(p.id,true);});
    markers.push(new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([p.lng,p.lat]).addTo(map));
  });
}

  qz={i:0,score:0,qs:shuffle(pts).slice(0,8).map(p=>{const im=pImg(p);return{p,kind:im&&Math.random()<.45?'photo':'place',im,opts:shuffle([p,...shuffle(pts.filter(x=>x!==p)).slice(0,3)])};})};

function renderQ(){
  const {i,qs}=qz;
  if(i>=qs.length){document.body.classList.remove('quiz');renderMarkers();const r=qz.score/qs.length;
    open('النتيجة',`<div class="score"><b>${qz.score}/${qs.length}</b><p class="q" style="margin-top:10px">${r===1?'تعرف أرضك شبرًا شبرًا':r>=.6?'معرفة طيبة، وبقي القليل':'الأرض تنتظر أن تتعرّف عليها'}</p><p class="muted">${r===1?'انقل ما تعرفه لمن هو أصغر منك.':'عُد إلى المعالم واقرأ حكاياتها ثم جرّب مرة أخرى.'}</p><div class="row" style="justify-content:center"><button class="b pri" id="qAgain">أعد الاختبار</button><button class="b lite" id="qPl">راجع المعالم</button></div></div>`);
    $('qAgain').onclick=showQuiz;$('qPl').onclick=()=>go('places');overview(2000);return;}
  const q=qs[i];
  let h=`<div class="prog"><i style="width:${i/qs.length*100}%"></i></div>`;
  if(q.kind==='photo'){document.body.classList.remove('quiz');h+=`<img class="qimg" src="${q.im.data}" alt=""><p class="q">أي معلم يظهر في هذه الصورة؟</p>`;}
  else{document.body.classList.add('quiz');h+=`<p class="q">ما اسم المكان المضيء على الخريطة؟</p>`;}
  h+=q.opts.map(o=>`<button class="opt" data-o="${o.id}">${esc(o.name)}</button>`).join('')+`<div class="row"><button class="b pri" id="qNext" style="display:none;width:100%">${i+1<qs.length?'السؤال التالي':'أظهر النتيجة'}</button></div>`;
  open(`السؤال ${i+1} من ${qs.length}`,h);
  renderMarkers();
  if(q.kind==='place'){markers.forEach(m=>m.getElement().classList.toggle('target',m.getElement().dataset.id===q.p.id));map.flyTo({center:[q.p.lng,q.p.lat],zoom:15.8,pitch:62,bearing:(i*71)%360,duration:2400,padding:isMobile()?{bottom:innerHeight*.5,top:60,left:0,right:0}:{right:420,top:0,bottom:0,left:0}});}
  $('shB').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=b.dataset.o===q.p.id;if(ok)qz.score++;
    $('shB').querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.o===q.p.id)x.classList.add('ok');});
    if(!ok)b.classList.add('no');
    $('qNext').style.display='';$('qNext').onclick=()=>{qz.i++;renderQ();};
  });
}

/* ================= التحرير ================= */
let picking=null,pend=[];
function pick(msg,cb){picking=cb;measure(false);$('hint').textContent=msg;$('hint').style.display='block';map.getCanvas().style.cursor='crosshair';}
map.on('click',async e=>{
  if(picking){const cb=picking;picking=null;$('hint').style.display='none';map.getCanvas().style.cursor='';cb(e.lngLat);return;}
  if(measuring){if(popup)popup.remove();popup=new maplibregl.Popup({closeButton:false,offset:8}).setLngLat(e.lngLat).setHTML('<span class="muted">جارٍ القياس…</span>').addTo(map);const a=await altAt(e.lngLat);if(popup)popup.setHTML(a==null?'<span class="muted">تعذّر القياس</span>':`<b>${a} م</b><span class="muted">فوق سطح البحر</span>`);}
});
function editPoint(p){
  const isNew=!state.points.includes(p);pend=[];const sel=new Set(p.media||[]);
  open(isNew?'معلم جديد':'تعديل المعلم',`
   <label class="f">اسم المعلم</label><input type="text" id="fN" value="${esc(p.name)}" placeholder="كما يسمّيه أهل المنطقة">
   <label class="f">النوع</label><select id="fT">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${p.type===k?'selected':''}>${v}</option>`).join('')}</select>
   <label class="f">الزمن (اختياري)</label><input type="text" id="fE" value="${esc(p.era||'')}" placeholder="مثال: بُني نحو 1950">
   <label class="f">الحكاية</label><textarea id="fS" placeholder="من بناه؟ من سكنه؟ ما الذي جرى فيه؟ ومن روى الحكاية؟">${esc(p.story||'')}</textarea>
   <label class="f">صور من الألبوم</label><div class="pick" id="pk">${allMedia().map(m=>`<div class="it ${sel.has(m.id)?'sel':''}" data-id="${esc(m.id)}">${m.kind==='video'?`<video src="${m.data}#t=1" muted preload="metadata"></video>`:`<img src="${m.data}" alt="">`}</div>`).join('')}</div>
   <label class="f">رفع صور جديدة، قديمة أو حديثة</label><input type="file" id="fU" accept="image/*" multiple><div id="uL"></div>
   <div class="row"><button class="b pri" id="fOk">حفظ</button>${isNew?'':`<button class="b danger" id="fDel">${ic('trash')} حذف</button>`}<button class="b lite" id="fNo">إلغاء</button></div>`,'tall');
  $('pk').querySelectorAll('.it').forEach(it=>it.onclick=()=>it.classList.toggle('sel'));
  $('fU').onchange=async e=>{for(const f of e.target.files){const it=await readImg(f);if(it)pend.push(it);}
    $('uL').innerHTML=pend.map((u,i)=>`<div data-i="${i}" style="display:flex;gap:8px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px"><img src="${u.data}" style="width:64px;height:64px;object-fit:cover;border-radius:8px" alt=""><div style="flex:1;display:grid;gap:5px"><input type="text" class="cp" placeholder="الوصف ومن صوّرها"><div style="display:flex;gap:8px;align-items:center"><input type="text" class="yr" placeholder="السنة" style="width:90px"><label style="font-size:13px;font-weight:600"><input type="checkbox" class="ol"> صورة قديمة</label></div></div></div>`).join('');e.target.value='';};
  $('fNo').onclick=()=>isNew?close():showPoint(p.id);
  if(!isNew)$('fDel').onclick=()=>ask('حذف هذا المعلم نهائيًا؟',()=>{state.points=state.points.filter(x=>x!==p);save();refresh();close();});
  $('fOk').onclick=()=>{const n=$('fN').value.trim();if(!n){toast('اكتب اسم المعلم');return;}
    p.name=n;p.type=$('fT').value;p.era=$('fE').value.trim();p.story=$('fS').value.trim();
    const ids=[...$('pk').querySelectorAll('.sel')].map(x=>x.dataset.id);
    $('uL').querySelectorAll('[data-i]').forEach(r=>{const u=pend[+r.dataset.i];u.caption=r.querySelector('.cp').value.trim();u.year=r.querySelector('.yr').value.trim();u.old=r.querySelector('.ol').checked;});
    pend.forEach(u=>{const id=uid();state.media[id]=u;ids.push(id);});p.media=ids;
    if(isNew)state.points.push(p);save();refresh();showPoint(p.id);toast('حُفظ المعلم');};
}
function readImg(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({kind:'image',data:c.toDataURL('image/jpeg',.8)});};im.onerror=()=>res(null);im.src=r.result;};r.readAsDataURL(f);});}
function parseLoc(s){s=(s||'').trim();
  const m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/[?&](?:q|ll|query|center)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)||s.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,،\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(m){const lat=+m[1],lng=+m[2];if(Math.abs(lat)<=90&&Math.abs(lng)<=180)return{lat,lng};}return null;}
function setup(){const m=state.meta;
  modal(`<h3>بيانات الأطلس</h3>
   <label class="f">اسم المنطقة</label><input type="text" id="sT" value="${esc(m.title)}">
   <label class="f">سطر تعريفي</label><input type="text" id="sS" value="${esc(m.sub||'')}" placeholder="المديرية والمحافظة">
   <label class="f">نبذة عن المنطقة تظهر في الغلاف وصفحة «تعلّم»</label><textarea id="sA" style="min-height:90px">${esc(m.about||'')}</textarea>
   <label class="f">الإحداثيات ${placed()?'(محدَّدة — اتركها فارغة للإبقاء عليها)':''}</label><input type="text" id="sL" dir="ltr" placeholder="13.9123, 45.2456">
   <p class="muted">في خرائط جوجل: اضغط مطولًا على وسط الوادي، ثم انسخ الرقمين الظاهرين.</p>
   <div class="row"><button class="b pri" id="sOk">حفظ</button><button class="b lite" id="sNo">إغلاق</button></div>`);
  $('sNo').onclick=closeModal;
  $('sOk').onclick=()=>{const v=$('sL').value.trim();let ll=null;if(v){ll=parseLoc(v);if(!ll){toast('لم أتعرّف على الإحداثيات');return;}}
    m.title=$('sT').value.trim()||'أطلس الوادي';m.sub=$('sS').value.trim();m.about=$('sA').value.trim();if(ll)m.center=[ll.lng,ll.lat];
    save();refresh();closeModal();if(ll)map.flyTo({center:m.center,zoom:14.8,pitch:64,bearing:-20,duration:4000});};
}
function exportFile(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'valley3d',v:2,state})],{type:'application/json'}));a.download='data.json';document.body.appendChild(a);a.click();a.remove();
  modal(`<h3>ملف النشر جاهز</h3><p class="muted">نُزّل ملف باسم <b dir="ltr">data.json</b> يحوي كل المعالم والحكايات والصور التي أضفتها. ما تضيفه محفوظ في متصفحك فقط حتى يُرفع هذا الملف إلى الموقع، وبعدها يراه كل من يفتح الرابط.</p><div class="row"><button class="b pri" id="mOk">فهمت</button></div>`);$('mOk').onclick=closeModal;}
$('fImp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.state)throw 0;
  ask('دمج الملف مع ما لديك؟',()=>{Object.assign(state.media,d.state.media||{});const ids=new Set(state.points.map(p=>p.id));(d.state.points||[]).forEach(p=>{if(ids.has(p.id))state.points[state.points.findIndex(x=>x.id===p.id)]=p;else state.points.push(p);});if(!placed()&&d.state.meta)state.meta=d.state.meta;save();refresh();overview();toast('تم الدمج');});}catch(err){toast('الملف غير صالح');}e.target.value='';};
$('ebar').innerHTML=`<button id="eAdd">${ic('plus')} معلم</button><button id="eSet">${ic('edit')} البيانات</button><button id="eExp">${ic('down')} ملف النشر</button><button id="eImp">${ic('up')}</button><button id="eOut">${ic('eye')}</button>`;
$('eAdd').onclick=()=>{if(!placed()){setup();return;}pick('المس موضع المعلم على الخريطة',async ll=>{editPoint({id:uid(),name:'',type:'house',lng:ll.lng,lat:ll.lat,alt:await altAt(ll),media:[]});});};
$('eSet').onclick=setup;$('eExp').onclick=exportFile;$('eImp').onclick=()=>$('fImp').click();
$('eOut').onclick=()=>{setEdit(false);toast('وضع الزائر — اضغط مطولًا على العنوان للعودة إلى التحرير');};
function setEdit(on){document.body.classList.toggle('edit',on);try{localStorage.setItem('edit',on?'1':'0');}catch(e){}}
(()=>{let t;const el=$('brand'),s=()=>{t=setTimeout(()=>{setEdit(true);toast('وضع التحرير مفعّل');},2500);},c=()=>clearTimeout(t);el.addEventListener('pointerdown',s);el.addEventListener('pointerup',c);el.addEventListener('pointerleave',c);})();

/* ================= نوافذ ================= */
function modal(h){$('mBox').innerHTML=h;$('modal').classList.add('open');}
function closeModal(){$('modal').classList.remove('open');}
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
function ask(msg,yes){modal(`<h3>${esc(msg)}</h3><div class="row"><button class="b pri" id="aY">نعم</button><button class="b lite" id="aN">لا</button></div>`);$('aY').onclick=()=>{closeModal();yes();};$('aN').onclick=closeModal;}
function lightbox(id){const m=mediaById(id);if(!m)return;$('lbM').innerHTML=m.kind==='video'?`<video src="${m.data}" controls autoplay playsinline></video>`:`<img src="${m.data}" alt="">`;$('lbC').textContent=[m.old?'صورة قديمة':'',m.caption,m.year].filter(Boolean).join(' · ');$('lb').classList.add('open');}
$('lbX').innerHTML=ic('x');$('lbX').onclick=()=>{$('lb').classList.remove('open');$('lbM').innerHTML='';};

/* ================= البدء ================= */
function enter(then){$('cover').classList.add('hide');
  if(!placed()){if(document.body.classList.contains('edit'))setTimeout(setup,500);else toast('لم يُحدَّد موقع المنطقة بعد',4000);then&&then();return;}
  overview(4200);then&&setTimeout(then,4300);}
$('cvTour').onclick=()=>enter(()=>{if(state.points.length)showPoint(state.points[0].id,true);});
$('cvMap').onclick=()=>enter(()=>go('learn'));
(async()=>{
  $('cover').style.backgroundImage="url('media/p2.jpg')";
  let ed=location.hash==='#edit';try{if(localStorage.getItem('edit')==='1')ed=true;}catch(e){}
  if(ed)setEdit(true);
  const [loc,pub]=await Promise.all([loadLocal(),loadPublished()]);
  const best=[loc,pub].filter(s=>s&&s.meta).sort((a,b)=>(b.rev||1)-(a.rev||1))[0];
  if(best){state=best;state.media=state.media||{};state.points=state.points||[];state.meta.exag=state.meta.exag||1.5;}
  refresh();
  const go0=()=>{map.setTerrain({source:'dem',exaggeration:state.meta.exag});if(placed())map.jumpTo({center:state.meta.center,zoom:11.5,pitch:0});};
  map.loaded()?go0():map.on('load',go0);
})();
</script>
